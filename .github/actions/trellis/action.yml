name: "Install trellis"
description: "Put a pinned trellis binary on the runner"

inputs:
  version:
    description: "trellis version to install; keep in sync with .mise.toml"
    required: false
    default: "0.8.0"

runs:
  using: "composite"
  steps:
    # The shell installer drops a prebuilt binary on the runner in about a
    # second and adds its install directory to $GITHUB_PATH itself.
    - name: Install trellis
      shell: bash
      env:
        TRELLIS_VERSION: ${{ inputs.version }}
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/tylerbutler/trellis/releases/download/v${TRELLIS_VERSION}/trellis-gleam-installer.sh" | sh
