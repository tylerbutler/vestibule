name: "Setup environment"
description: "Install mise-managed tools with monorepo-aware Gleam dependency caching"

inputs:
  cache:
    description: "Whether to restore and save Gleam dependencies"
    required: false
    default: "true"
  node:
    description: "Whether to setup Node.js for JavaScript target"
    required: false
    default: "false"

outputs:
  cache-key:
    description: "The exact Gleam dependency cache key"
    value: ${{ steps.cache-key.outputs.value }}

runs:
  using: "composite"
  steps:
    - name: Setup tools
      uses: ./.github/actions/mise

    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
      with:
        node-version: "22"

    - name: Compute dependency cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      env:
        MANIFEST_HASH: ${{ hashFiles('gleam.toml', 'manifest.toml', 'packages/*/gleam.toml', 'packages/*/manifest.toml', 'example/gleam.toml', 'example/manifest.toml') }}
      run: echo "value=gleam-${RUNNER_OS}-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore Gleam dependencies
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
      with:
        path: |
          build/packages
          packages/*/build/packages
          example/build/packages
          ~/.cache/gleam
        key: ${{ steps.cache-key.outputs.value }}
        restore-keys: gleam-${{ runner.os }}-
