name: "Setup Gleam Environment"
description: "Thin wrapper around setup-gleam with monorepo-aware caching"

inputs:
  cache:
    description: "Whether to restore and save Gleam dependencies"
    required: false
    default: "true"
  node:
    description: "Whether to setup Node.js for JavaScript target"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Gleam
      uses: tylerbutler/actions/setup-gleam@1b043450f1919503d6c23e3ada9fc7aaa4e2a99b # ratchet:tylerbutler/actions/setup-gleam@main
      with:
        node: ${{ inputs.node }}
        # Dependency download and caching are handled below across every workspace
        # member rather than only the root package.
        cache: "false"
        run-deps: "false"

    - name: Cache Gleam dependencies
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
      with:
        path: |
          build/packages
          packages/*/build/packages
          example/build/packages
          ~/.cache/gleam
        # Hash every member's manifests so the cache invalidates when any of them
        # adds, removes, or changes a dependency. The example is included: it is
        # a task-fan-out member, and its git dependency makes it re-resolve — a
        # cold cache there means every CI job queries the Hex API at once, which
        # is enough to trip the per-IP rate limit.
        key: gleam-${{ runner.os }}-${{ hashFiles('gleam.toml', 'manifest.toml', 'packages/*/gleam.toml', 'packages/*/manifest.toml', 'example/gleam.toml', 'example/manifest.toml') }}
        restore-keys: gleam-${{ runner.os }}-
