name: "Setup Gleam Environment"
description: "Thin wrapper around setup-gleam with monorepo-aware caching"

inputs:
  node:
    description: "Whether to setup Node.js for JavaScript target"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Gleam
      uses: tylerbutler/actions/setup-gleam@ed7d5e5f1d4370a5ccf06503916e3c301102ab1c # ratchet:tylerbutler/actions/setup-gleam@main
      with:
        node: ${{ inputs.node }}
        # Disable built-in caching — it hashes a single gleam.toml in the working
        # directory, which doesn't work for our monorepo layout (packages/*/gleam.toml).
        # We add our own cache step below with the correct hashFiles() patterns.
        cache: "false"

    - name: Cache Gleam dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
      with:
        path: |
          build/packages
          packages/*/build/packages
          example/build/packages
          ~/.cache/gleam
        # Hash every member's manifests so the cache invalidates when any of them
        # adds, removes, or changes a dependency. The example is included: it is
        # a task-fan-out member, and its git dependency makes it re-resolve. The
        # CI dependency job warms this complete cache before the task jobs fan
        # out, keeping Hex access on one runner.
        key: gleam-${{ runner.os }}-${{ hashFiles('gleam.toml', 'manifest.toml', 'packages/*/gleam.toml', 'packages/*/manifest.toml', 'example/gleam.toml', 'example/manifest.toml') }}
        restore-keys: gleam-${{ runner.os }}-
