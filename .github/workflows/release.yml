name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Candidate mode: rc, none to promote, or empty to retain the current mode"
        type: string
        default: ""
      targets:
        description: "Optional space-separated targets, for example vestibule=0.2.0 vestibule_github=0.2.0"
        type: string
        default: ""

concurrency:
  group: trellis-release-preparation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/mise

      - name: Validate release inputs
        env:
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          python3 -B scripts/release_request.py \
            --pre "$INPUT_PRE" --targets "$INPUT_TARGETS" > "$RUNNER_TEMP/release-args.json"

      - name: Verify previous release is complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          trellis list --json > "$RUNNER_TEMP/packages.json"
          trellis tag plan --json > "$RUNNER_TEMP/tags.json"
          gh api "repos/$REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 -B scripts/release_ready.py \
            --packages "$RUNNER_TEMP/packages.json" \
            --tags "$RUNNER_TEMP/tags.json" \
            --releases "$RUNNER_TEMP/releases.json"

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release PR
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          mapfile -t arguments < <(jq -r '.[]' "$RUNNER_TEMP/release-args.json")
          trellis release pr --base main --branch release/pending \
            "${arguments[@]}" --github-output >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          OUTCOME: ${{ steps.release.outputs.outcome }}
        run: |
          case "$OUTCOME" in
            prepared) message="Release PR created or updated." ;;
            unchanged) message="Release content and intent are unchanged." ;;
            no_changes) message="No eligible release changes." ;;
            *) echo "::error::Unexpected release outcome: $OUTCOME"; exit 1 ;;
          esac
          printf '### Release preparation\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
