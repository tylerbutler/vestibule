name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install trellis
        uses: ./.github/actions/trellis

      # No pending fragments means nothing to release; skip rather than fail.
      - name: Plan release
        id: plan
        run: |
          plan=$(trellis version plan --json)
          echo "count=$(echo "$plan" | jq '.bumped | length')" >> "$GITHUB_OUTPUT"
          echo "versions=$(echo "$plan" | jq -r '[.bumped[] | "\(.name) \(.current) -> \(.next)"] | join(", ")')" >> "$GITHUB_OUTPUT"

      # `release pr` runs `version apply` on a branch and opens (or updates) the
      # PR. Version bumps, per-package CHANGELOG.md files, and the locked
      # workspace versions in every manifest.toml are handled natively — no Gleam
      # toolchain and no Hex network calls, so this workflow no longer needs a
      # post-batch lockfile refresh pass of its own.
      - name: Create release PR
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: trellis release pr --base main

      - name: Summary
        if: steps.plan.outputs.count != '0'
        env:
          VERSIONS: ${{ steps.plan.outputs.versions }}
        run: |
          echo "### Release PR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Versions:** $VERSIONS" >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped
        if: steps.plan.outputs.count == '0'
        run: |
          echo "### Release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No unreleased change fragments found." >> "$GITHUB_STEP_SUMMARY"
