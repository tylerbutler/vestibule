name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # PR title conventional commit validation.
  # Release PRs are skipped: `trellis release pr` writes its own title
  # ("release: <pkg> v<version>, …"), which is neither a conventional type nor
  # short enough for header-max-length.
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.head_ref != 'release/pending'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: (.+)$"
          match = re.fullmatch(pattern, title)
          if len(title) > 72 or not match or match.group(3).endswith("."):
              sys.exit("PR title must be a Conventional Commit header of at most 72 characters")
          PY

  # Changelog entry check. A release PR consumes the fragments rather than
  # adding any, so it is skipped here too.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.head_ref != 'release/pending'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup tools
        uses: ./.github/actions/mise
      # Advisory, as the changie check it replaced was: the result drives the
      # sticky comment below rather than failing the PR.
      - name: Check changelog fragments
        id: changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trellis changelog check --base "$BASE_SHA" --head "$HEAD_SHA" --json > check.json || true
          {
            echo "has-entries=$(jq -r '.has_entries' check.json)"
            echo "needs-entry=$(jq -r '.needs_entry' check.json)"
            echo "missing=$(jq -r '[.packages[] | select(.changed and (.has_entry | not)) | .name] | join(", ")' check.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Workspace invariants
        run: trellis doctor --format github
      - name: Report missing changelog
        if: steps.changelog.outputs.has-entries == 'false' && steps.changelog.outputs.needs-entry == 'true'
        env:
          MISSING: ${{ steps.changelog.outputs.missing }}
        run: 'echo "::warning::Releasable packages without a changelog fragment: $MISSING"'
