name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  # PR title conventional commit validation.
  # Release PRs are skipped: `trellis release pr` writes its own title
  # ("release: <pkg> v<version>, …"), which is neither a conventional type nor
  # short enough for header-max-length.
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.head_ref != 'release/pending'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  # Changelog entry check. A release PR consumes the fragments rather than
  # adding any, so it is skipped here too.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.head_ref != 'release/pending'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup tools
        uses: ./.github/actions/mise
      # Advisory, as the changie check it replaced was: the result drives the
      # sticky comment below rather than failing the PR.
      - name: Check changelog fragments
        id: changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trellis changelog check --base "$BASE_SHA" --head "$HEAD_SHA" --json > check.json || true
          {
            echo "has-entries=$(jq -r '.has_entries' check.json)"
            echo "needs-entry=$(jq -r '.needs_entry' check.json)"
            echo "missing=$(jq -r '[.packages[] | select(.changed and (.has_entry | not)) | .name] | join(", ")' check.json)"
            echo "preview<<PREVIEW_EOF"
            jq -r '.preview' check.json
            echo "PREVIEW_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Workspace invariants
        run: trellis doctor --format github
      - name: Comment with changelog preview
        if: steps.changelog.outputs.has-entries == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: |
            ## Changelog Preview

            This PR adds the following changelog entries:

            ${{ steps.changelog.outputs.preview }}
      - name: Comment about missing changelog
        if: steps.changelog.outputs.has-entries == 'false' && steps.changelog.outputs.needs-entry == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: |
            ## Missing Changelog Entry

            This PR changes releasable packages (`${{ steps.changelog.outputs.missing }}`) that have no unreleased changelog fragment.

            To add one, run:

            ```
            just change <package> <kind> "What changed"
            ```
      - name: Remove changelog comment
        if: steps.changelog.outputs.has-entries == 'false' && steps.changelog.outputs.needs-entry == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          delete: true
