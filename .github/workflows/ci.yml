name: CI

# One job per task. `trellis run` fans each task across every workspace package
# graph-parallel, so no job needs a package matrix — or a list of packages to
# build one from.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    env:
      HEXPM_READ_API_KEY: ${{ secrets.HEXPM_API_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      # Warm the shared dependency cache before the fan-out jobs start. Running
      # serially lets later packages reuse downloads from earlier packages and
      # avoids a burst of concurrent requests from one runner.
      - run: trellis run deps --serial

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run format --check

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run build --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Install trellis
        uses: ./.github/actions/trellis
      - run: trellis run docs
