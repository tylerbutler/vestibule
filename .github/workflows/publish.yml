name: Publish

# Tags as record: the release PR merging is what ships a release. `trellis
# publish` walks the dependency graph itself, so no workflow here needs to know
# which packages exist — vestibule reaches Hex before the packages that depend
# on it, and every step is idempotent, so a partial failure is fixed by
# re-running this workflow.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish to Hex.pm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/pending')
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install trellis
        uses: ./.github/actions/trellis

      # Per package, in dependency order: skip what Hex already has, validate
      # (gleam format --check, build --warnings-as-errors, test), rewrite the
      # vestibule path dependency to a Hex requirement derived from its current
      # version, publish, then restore the original gleam.toml.
      - name: Publish to Hex.pm
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: trellis publish --all-untagged

      # Only once Hex has the packages: record what shipped as per-version tags
      # with a GitHub Release each, bodied from the matching CHANGELOG section.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: trellis tag create --github-release

      # Refresh manifest.toml lockfiles so the repo resolves against the
      # versions just published. Scoped per package — refreshing the whole
      # workspace at once is what gets a runner rate-limited by Hex.
      - name: Refresh lockfiles
        run: |
          trellis list --json | jq -r '.packages[].name' | while read -r pkg; do
            echo "Refreshing $pkg manifest..."
            trellis lockfile refresh --package "$pkg"
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- '*.toml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile changes detected:"
            git diff --stat -- '*.toml'
          fi

      - name: Create lockfile update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="chore/update-lockfiles-${RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A '*.toml'
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update lockfiles after publish"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update lockfiles after publish" \
            --body "Auto-generated PR to refresh \`manifest.toml\` lockfiles after publishing." \
            --base main \
            --head "$BRANCH"

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          trellis tag plan --json | jq -r '.tags | length as $n
            | if $n == 0 then "- All releasable package versions are tagged and on Hex."
              else "- \($n) tag(s) still pending; re-run this workflow." end' \
            >> "$GITHUB_STEP_SUMMARY"
