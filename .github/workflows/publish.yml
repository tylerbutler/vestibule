name: Release

# PUBLISHING TO HEX IS OFF while the packages are pre-release. The publish step
# below runs `--dry-run`: it resolves what would ship and how each path
# dependency would be rewritten, but makes no Hex API call and uploads nothing.
# To turn publishing on: drop `--dry-run`, give that step
# `HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}`, and restore the lockfile
# refresh described further down.
#
# Tags as record: the release PR merging is what cuts a release. `trellis`
# walks the dependency graph itself, so no workflow here needs to know which
# packages exist, and every step is idempotent — a partial failure is fixed by
# re-running this workflow.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Tag and release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/pending')
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      # Publishing disabled — see the note at the top of this file. This reports
      # the packages that would ship, in dependency order, and the Hex
      # requirement each vestibule path dependency would be rewritten to.
      - name: Preview publish (publishing is off)
        run: trellis publish --all-untagged --dry-run

      # Record each release as two tags: the immutable {name}-v{version}, which
      # carries a GitHub Release bodied from the matching CHANGELOG section, and
      # the moving {name}-v{series}, which is force-moved to this release and
      # carries none.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: trellis tag create --github-release

      # No lockfile refresh step while publishing is off: `version apply` already
      # patched the locked workspace versions, and with nothing reaching Hex a
      # refresh could only pull in unrelated external-dependency updates. Restore
      # one (`trellis lockfile refresh --package <pkg>`, scoped per package —
      # refreshing the whole workspace at once is what gets a runner
      # rate-limited) when publishing is turned back on.

      - name: Summary
        run: |
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishing to Hex is off; nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          trellis tag plan --json | jq -r '.tags | length as $n
            | if $n == 0 then "- Every releasable package version is tagged."
              else "- \($n) tag(s) still pending; re-run this workflow." end' \
            >> "$GITHUB_STEP_SUMMARY"
