name = "vestibule"
version = "0.0.1"
description = "Strategy-based OAuth2 authentication for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "vestibule" }
gleam = ">= 1.7.0"

internal_modules = [
  "vestibule/internal",
  "vestibule/internal/*",
  "vestibule/state",
  "vestibule/pkce",
  "vestibule/transport_flow",
]

[dependencies]
gleam_stdlib = ">= 0.48.0 and < 2.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.7.0 and < 2.0.0"

[dev-dependencies]
startest = ">= 0.8.0 and < 1.0.0"
glinter = ">= 2.19.0 and < 3.0.0"

[tools.glinter]
# Strict lint: any warning fails the build. glinter only supports this
# globally (no per-rule error severity), so label_possible is turned off
# below to keep intentional unlabelled subject/pipe first-args from failing.
warnings_as_errors = true

[tools.glinter.rules]
# Argument labels are encouraged but not enforced: many functions intentionally
# leave their subject/pipe-receiver first arg unlabelled.
label_possible = "off"
# Public library API: these functions are part of vestibule's published surface
# and are intentionally exported for external consumers, even when unused within
# the monorepo.
unused_exports = "off"
# Deliberate crash-on-startup pattern: init/store-style functions assert on
# known-good values during one-time VM setup. Result-returning try_* variants are
# provided for callers that need to handle failure.
assert_ok_pattern = "off"
# By design, low-level errors (uri.parse, request.to, httpc — often Nil/opaque)
# are mapped into descriptive domain AuthError variants; the source errors carry
# no additional context worth wrapping.
error_context_lost = "off"
# Intentional best-effort / fallback control flow (e.g. URL parse fallbacks)
# where discarding the error is the desired behavior.
thrown_away_error = "off"
# Private @external FFI declarations return String reasons that are immediately
# mapped to the typed StateStoreError; the stringly-typed boundary is internal.
stringly_typed_error = "off"

# Workspace configuration for trellis. This table's presence is what marks the
# workspace root; every key in it is optional.
#
# Members are auto-discovered — every gleam.toml git knows about, outside
# build/. Add `members = ["packages/*"]` only to pin them to something
# narrower than that.
#
# Task exclusions, custom tasks, tag formats, and changelog kinds are all
# configured here too: https://trellis.tylerbutler.com/docs/configuration/
[tools.trellis]

# The example app and the Apple, Google, Microsoft, and OIDC providers remain
# full workspace members, so normal tasks still build and test them. They are
# not versioned, tagged, released, or published by trellis.
[tools.trellis.exclude]
"@release" = [
  "example",
  "packages/vestibule_apple",
  "packages/vestibule_google",
  "packages/vestibule_microsoft",
  "packages/vestibule_oidc",
]
docs = ["example"]

# Each release writes two tags per package: the immutable `{name}-v{version}`,
# which carries the GitHub Release, and a moving `{name}-v{series}` that always
# points at the newest release in its series, so consumers can pin
# `vestibule-v0.0` instead of chasing every patch. The series is derived from the
# version, never configured: while the major is 0 it is `major.minor` (every
# minor bump being breaking), and the major alone from 1.0 on. Series tags are
# force-moved on each release, which is why they carry no GitHub Release — it
# would silently retarget on the next move.
[tools.trellis.publish]
tag_mode = "both"

# `build`, `test`, `check`, `format`, `docs`, `deps`, and `clean` are built in;
# only glinter needs declaring.
[tools.trellis.tasks.lint]
command = "gleam run -m glinter"
needs_deps = true

# Kinds carried over from the changie configuration this replaced. Breaking is
# a minor bump while the packages are pre-1.0, where breaking changes are
# expected; switch it to "major" at 1.0. One-off overrides don't need a config
# change — `trellis version apply --bump <pkg>=major` covers those.
[tools.trellis.changelog]
# CHANGELOG.md is generated from the sections under .changes/<package>/, so the
# Keep a Changelog preamble that used to live in .changes/header.md is rendered
# from here instead.
header_format = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
kinds = [
  { label = "Breaking", bump = "minor" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "patch" },
  { label = "Deprecated", bump = "patch" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "patch" },
  { label = "Reverted", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
  { label = "Security", bump = "patch" },
]
