project: vestibule
kind: Breaking
body: '`AuthError(e)` is now an opaque type. The public variant constructors (`StateMismatch`, `InvalidNonce`, `MissingCallbackParam`, `CodeExchangeFailed`, `UserInfoFailed`, `ProviderError`, `HttpError`, `DecodeError`, `NetworkError`, `ConfigError`, `RefreshUnsupported`, `Custom`) have been replaced by constructor functions (`error.state_mismatch`, `error.invalid_nonce`, `error.missing_callback_param`, `error.code_exchange`, `error.user_info`, `error.provider`, `error.http`, `error.decode`, `error.network`, `error.config`, `error.refresh_unsupported`, `error.custom`) and accessor functions. Inspect errors with `error.kind` (returns an `ErrorKind` enum with an `OtherKind` catch-all so new kinds never break exhaustive matches), `error.phase`, `error.message`, `error.provider_error` (+ `provider_code`/`provider_description`/`provider_uri`), `error.http_status`, `error.http_summary`, `error.missing_param`, and `error.custom_payload`. Raw HTTP response bodies are no longer exposed; `error.http_summary` returns a sanitized, truncated summary. Code that pattern-matched on `AuthError` variants must migrate to the constructor and accessor functions.'
time: 2026-06-23T08:32:00-07:00
