package = "vestibule"
kind = "Security"
body = "`provider_support.require_public_https` now rejects numeric hosts that are not a canonical dotted quad (`127.1`, `2130706433`, octal `0177.0.0.1`) and trailing-dot names like `localhost.`, all of which the system resolver treats as loopback. Added `provider_support.require_public_host` for server-fetched URLs where plain HTTP is allowed but non-public hosts are not"
