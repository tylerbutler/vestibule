package = "vestibule"
kind = "Breaking"
body = "`strategy.new` is now a two-argument builder: `strategy.new(provider:, default_scopes:)` followed by `with_authorize_url`, `with_exchange_code`, `with_fetch_user`, the optional `with_refresh`, and the optional `with_nonce` (replacing the old `uses_nonce` argument). Provider capabilities are now extensible without future breaking constructor changes. Strategies built without `with_refresh` return `error.refresh_unsupported()`, an AuthError of kind `RefreshUnsupportedKind`, from `vestibule.refresh_token`; a missing required capability (authorize URL, code exchange, or user fetch) fails with `error.config(reason:)`, an AuthError of kind `ConfigKind`. Custom strategies must migrate from the old 7-argument `strategy.new` to the builder API."
