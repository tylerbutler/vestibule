# Manifest for the Gleam review eval. `expected_*` fields are explicit grader
# expectations, and `fixture_mode` describes source/layout evidence rather than
# standalone packages. The `tool-config-in-gleam-toml` pair retains the sole
# actual fixture `gleam.toml` as minimal good configuration. Its bad directory
# stages a matching `gleam.toml.fixture` beside `security-scan.toml`; a Vally
# stimulus materializes that template as `gleam.toml` when needed. Optional
# `stimulus_context` identifies a load-bearing package role:
# `reusable_library` or `application_top_level_main`. `disposition` says whether
# the rule is covered by paired fixtures, rubric, or exclusion.
