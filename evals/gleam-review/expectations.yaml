# Expected outcomes for the staged gleam-review fixture corpus.
version: 1
rule_manifest: rule-manifest.yaml

path_bases:
  manifest_directory: evals/gleam-review
  fixture_path: relative to manifest_directory
  anchor_path: relative to manifest_directory
  report_location: source path plus :line; regexes allow the fixture prefix to be omitted after staging

global_expectations:
  multi_anchor_semantics: any
  multi_anchor_expectation: A case with multiple anchors satisfies the deterministic location expectation when one file:line citation matches any listed anchor.
  report_contract:
    verdict_first: true
    section_tiers:
      convention: Violations
      anti-pattern: Violations
      pattern: Suggestions
    every_finding_has_file_line: true
    no_formatting_findings: true
    patterns_are_suggestions_not_violations: true

cases:
  - id: avoid-unqualified-imports-bad
    rule_slug: avoid-unqualified-imports
    variant: bad
    fixture_path: fixtures/avoid-unqualified-imports/bad
    expected_classification: violation
    expected_report_section: Violations
    expected_finding_label: Avoid unqualified importing of functions and constants
    anchors:
      - path: fixtures/avoid-unqualified-imports/bad/src/fixture_app.gleam
        line: 1
        report_location_regex: '(?:fixtures/avoid-unqualified-imports/bad/)?src/fixture_app\.gleam:1\b'
      - path: fixtures/avoid-unqualified-imports/bad/src/fixture_app.gleam
        line: 2
        report_location_regex: '(?:fixtures/avoid-unqualified-imports/bad/)?src/fixture_app\.gleam:2\b'
    semantic_criterion: Functions are imported from other modules and called without module qualifiers.

  - id: avoid-unqualified-imports-good
    rule_slug: avoid-unqualified-imports
    variant: good
    fixture_path: fixtures/avoid-unqualified-imports/good
    expected_clean_behavior:
      no_paired_finding: true
      no_violations: true
    prohibited_finding_labels:
      - Avoid unqualified importing of functions and constants
    semantic_criterion: External functions are called through their list or string module qualifiers.

  - id: annotate-module-functions-bad
    rule_slug: annotate-module-functions
    variant: bad
    fixture_path: fixtures/annotate-module-functions/bad
