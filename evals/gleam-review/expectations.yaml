    expected_report_section: Violations
    expected_finding_label: Annotate all module functions
    anchors:
      - path: fixtures/annotate-module-functions/bad/src/fixture_app.gleam
        line: 1
        report_location_regex: '(?:fixtures/annotate-module-functions/bad/)?src/fixture_app\.gleam:1\b'
    semantic_criterion: The public module function omits both argument and return type annotations.

  - id: annotate-module-functions-good
