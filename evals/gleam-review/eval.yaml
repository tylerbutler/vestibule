name: gleam-review
description: Evaluate the read-only Gleam review skill against paired convention, pattern, and anti-pattern fixtures.
version: "1.0.0"
type: capability

defaults:
  runs: 1
  timeout: 3m
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol

environment:
  skills:
    - ../../.claude/skills/gleam-review

stimuli:
  - name: avoid-unqualified-imports-bad
    prompt: |
      Use the `gleam-review` skill to review the full staged workspace. Invoke the skill by its exact name, `gleam-review`, without a leading slash.
      Read all in-scope files completely before reviewing. Do not edit or refactor files.
      Return only the review.
    environment:
      files:
        - src: fixtures/avoid-unqualified-imports/bad
          dest: .
    constraints: { max_turns: 12, max_tokens: 12000, max_duration: 2m }
    rubric:
      - "The review identifies unqualified imported function calls, classifies them as a violation in ## Violations with a valid file:line anchor, fully reviews the staged workspace, and avoids unsupported findings."
    graders:
      - type: skill-invocation
        config: { required: [gleam-review] }
      - type: output-contains
        config: { substring: "## Violations", case_sensitive: true }
      - type: output-contains
        config: { substring: "Avoid unqualified importing of functions and constants", case_sensitive: true }
      - type: output-matches
        config:
          pattern: '(?:(?:fixtures/avoid-unqualified-imports/bad/)?src/fixture_app\.gleam:1\b|(?:fixtures/avoid-unqualified-imports/bad/)?src/fixture_app\.gleam:2\b)'
      - type: prompt
        config:
          prompt: "Judge the final review against this case's rubric. Pass only when every criterion is satisfied."
          scoring: binary
          threshold: 0.5
          evidence: [trajectory]

